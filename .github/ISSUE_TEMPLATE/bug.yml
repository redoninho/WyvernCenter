name: Bug report
description: Something doesn't work as it should.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Wyvern Center version
      placeholder: e.g. 0.4.0 (Settings or the main window footer)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Laptop model and EC firmware
      description: Shown in Settings → This laptop.
      placeholder: e.g. MSI GF63 Thin 10SC · 16R5EMS1.102
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Log
      description: If relevant, the end of C:\Program Files\Wyvern Center\data\log.txt (and crash.log if there is one). Open them from an administrator Notepad.
      render: text
